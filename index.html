<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07c160">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="面具对话">
<title>面具对话</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<style>
:root{
  --wx-page-bg:#111111;
  --wx-chat-bg:#ededed;
  --wx-header-bg:#f7f7f7;
  --wx-line:#dddddd;
  --wx-bar-bg:#ffffff;
  --wx-bubble-me:#95ec69;
  --wx-bubble-other:#ffffff;
  --wx-text:#111111;
  --wx-name:#999999;
  --wx-accent:#07c160;
  --wx-accent-text:#ffffff;
  --wx-input-bg:#ffffff;
  --wx-composer-bg:#f7f7f7;
  --wx-font-size:16px;
  --wx-name-size:11px;
  --wx-radius:6px;
  --wx-avatar-radius:6px;
  --wx-max-width:480px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--wx-page-bg);
  display:flex;justify-content:center;
}
.phone{
  width:100%;max-width:var(--wx-max-width);
  height:100vh;height:100dvh;
  background:var(--wx-chat-bg);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}

/* 顶栏 */
.wx-header{
  height:50px;flex-shrink:0;
  background:var(--wx-header-bg);
  border-bottom:1px solid var(--wx-line);
  display:flex;align-items:center;padding:0 8px;gap:4px;
}
.back{font-size:28px;width:26px;color:var(--wx-text);}
.title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--wx-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.header-btn{
  border:0;background:transparent;color:#576b95;
  font-size:14px;padding:6px 8px;flex-shrink:0;
}

/* 身份栏 */
.identity-bar{
  flex-shrink:0;background:var(--wx-bar-bg);
  border-bottom:1px solid #e5e5e5;
  padding:7px 10px;display:flex;align-items:center;gap:8px;
  font-size:13px;color:#666;
}
.current-mask{
  border:1px solid var(--wx-line);background:#f7f7f7;color:var(--wx-text);
  border-radius:14px;padding:4px 10px;font-size:13px;
  display:flex;align-items:center;gap:6px;max-width:150px;
}
.mini-avatar{
  width:20px;height:20px;border-radius:5px;background:#ddd;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;overflow:hidden;flex-shrink:0;
}
.mini-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.current-mask .mask-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.identity-bar .small-btn{
  margin-left:auto;border:1px solid var(--wx-line);background:#fff;
  border-radius:14px;padding:5px 10px;font-size:13px;color:#576b95;
}

/* 聊天区 */
.chat{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 12px 20px;
  background:var(--wx-chat-bg);
}
.empty{text-align:center;color:#999;font-size:13px;margin-top:40px;}

.message{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;}
.message.me{flex-direction:row-reverse;}
.avatar{
  width:40px;height:40px;border-radius:var(--wx-avatar-radius);
  background:#ddd;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.content{max-width:72%;display:flex;flex-direction:column;min-width:0;}
.message.me .content{align-items:flex-end;}
.name{
  font-size:var(--wx-name-size);color:var(--wx-name);
  margin-bottom:3px;padding:0 4px;
}
.bubble{
  background:var(--wx-bubble-other);color:var(--wx-text);
  padding:9px 12px;border-radius:var(--wx-radius);
  font-size:var(--wx-font-size);line-height:1.45;
  word-break:break-word;white-space:pre-wrap;
  box-shadow:0 1px 1px rgba(0,0,0,.03);
}
.message.me .bubble{background:var(--wx-bubble-me);}

/* 输入区 */
.composer{
  flex-shrink:0;
  background:var(--wx-composer-bg);
  border-top:1px solid var(--wx-line);
  padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:7px;
}
.switch-btn{
  width:40px;height:38px;border-radius:8px;border:0;
  background:var(--wx-accent);color:var(--wx-accent-text);
  font-size:18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.switch-btn img{width:100%;height:100%;object-fit:cover;display:block;}
#msgInput{
  flex:1;min-width:0;height:38px;border:0;border-radius:6px;
  padding:0 10px;font-size:16px;outline:none;
  background:var(--wx-input-bg);color:var(--wx-text);
}
.send-btn{
  height:38px;border:0;border-radius:6px;
  background:var(--wx-accent);color:var(--wx-accent-text);
  font-size:15px;padding:0 14px;flex-shrink:0;
}

/* 弹层 */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;
}
.overlay.show{opacity:1;pointer-events:auto;}

.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;
  max-width:var(--wx-max-width);
  background:#fff;border-radius:16px 16px 0 0;z-index:21;
  transform:translateY(110%);
  transition:transform .25s ease;
  display:flex;flex-direction:column;
  max-height:88vh;
  padding-bottom:env(safe-area-inset-bottom);
  overflow:hidden;
}
.sheet.show{transform:translateY(0);}

.sheet-head{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;font-size:16px;font-weight:600;color:#111;
  border-bottom:1px solid #f0f0f0;
}
.sheet-head button{
  border:0;background:transparent;font-size:14px;color:#07c160;font-weight:500;
}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;}

.mask-list{padding:6px 0 14px;}
.mask-row{display:flex;align-items:center;gap:10px;padding:10px 16px;}
.mask-row:active{background:#f5f5f5;}
.mask-row.active .mask-name{color:#07c160;font-weight:600;}
.mask-avatar{
  width:38px;height:38px;border-radius:6px;background:#e2e2e2;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;overflow:hidden;flex-shrink:0;
}
.mask-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.mask-info{flex:1;min-width:0;}
.mask-name{font-size:15px;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mask-meta{font-size:12px;color:#999;margin-top:2px;}
.mask-edit{
  border:0;background:#f2f2f2;border-radius:12px;
  padding:6px 12px;font-size:13px;color:#576b95;flex-shrink:0;
}

.field{
  padding:12px 16px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid #f2f2f2;
}
.field label{width:56px;font-size:14px;color:#666;flex-shrink:0;}
.field input{
  flex:1;min-width:0;border:0;outline:none;
  font-size:15px;background:transparent;color:#111;
}
.side-choice{display:flex;gap:8px;}
.side-choice button{
  border:1px solid #ddd;background:#fff;border-radius:14px;
  padding:6px 14px;font-size:13px;color:#333;
}
.side-choice button.active{background:#07c160;border-color:#07c160;color:#fff;}

.sheet-actions{padding:14px 16px;display:flex;gap:10px;flex-shrink:0;}
.sheet-actions button{
  flex:1;height:44px;border-radius:8px;border:0;font-size:15px;
}
.btn-primary{background:#07c160;color:#fff;}
.btn-plain{background:#f2f2f2;color:#333;}
.btn-danger{background:#fff;color:#e64340;border:1px solid #f0c0bf;}

/* 设置面板 */
.setting-block{padding:14px 16px 4px;}
.setting-block h4{
  margin:0 0 8px;font-size:14px;color:#111;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;
}
.setting-block h4 span{font-size:12px;color:#999;font-weight:400;}
#cssEditor{
  width:100%;height:210px;resize:vertical;
  border:1px solid #e5e5e5;border-radius:8px;
  background:#fafafa;color:#222;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.55;
  padding:10px;outline:none;
  -webkit-text-size-adjust:100%;
}
.preset-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
.preset-row button{
  border:1px solid #ddd;background:#fff;border-radius:14px;
  padding:6px 12px;font-size:12.5px;color:#333;
}
.hint{font-size:12px;color:#999;line-height:1.6;padding:0 16px 12px;}
.hint code{
  background:#f2f2f2;border-radius:3px;padding:1px 4px;
  font-size:11.5px;color:#c7254e;
}
</style>
</head>
<body>

<div class="phone">
  <header class="wx-header">
    <div class="back">‹</div>
    <div class="title">面具对话</div>
    <button class="header-btn" id="clearBtn">清空</button>
    <button class="header-btn" id="settingsBtn">设置</button>
  </header>

  <div class="identity-bar">
    <span>当前身份</span>
    <button class="current-mask" id="currentMaskBtn"></button>
    <button class="small-btn" id="maskPanelBtn">切换 / 面具</button>
  </div>

  <main class="chat" id="chat"></main>

  <footer class="composer">
    <button class="switch-btn" id="quickSwitchBtn">换</button>
    <input type="text" id="msgInput" autocomplete="off" autocorrect="off" autocapitalize="off">
    <button class="send-btn" id="sendBtn">发送</button>
  </footer>
</div>

<div class="overlay" id="overlay"></div>

<!-- 面具列表 -->
<div class="sheet" id="maskSheet">
  <div class="sheet-head">
    <span>面具列表</span>
    <button id="newMaskBtn">+ 新建面具</button>
  </div>
  <div class="sheet-body">
    <div class="mask-list" id="maskList"></div>
  </div>
</div>

<!-- 编辑面具 -->
<div class="sheet" id="editSheet">
  <div class="sheet-head">
    <span id="editTitle">编辑面具</span>
    <button id="cancelEditBtn">取消</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>名字</label>
      <input type="text" id="nameInput" placeholder="给这个面具起个名字">
    </div>
    <div class="field">
      <label>头像</label>
      <input type="text" id="avatarInput" placeholder="emoji，或图片链接 / data URL">
    </div>
    <div class="field">
      <label>位置</label>
      <div class="side-choice">
        <button data-side="right">右侧</button>
        <button data-side="left">左侧</button>
      </div>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn-plain" id="cancelEditBtn2">取消</button>
    <button class="btn-primary" id="saveMaskBtn">保存</button>
    <button class="btn-danger" id="deleteMaskBtn">删除</button>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="settingsSheet">
  <div class="sheet-head">
    <span>设置</span>
    <button id="closeSettingsBtn">完成</button>
  </div>
  <div class="sheet-body">
    <div class="setting-block">
      <h4>自定义 CSS <span>实时生效 · 自动保存</span></h4>
      <textarea id="cssEditor" spellcheck="false" placeholder="在这里写 CSS，例如：
:root{ --wx-bubble-me:#a0e75a; }
.bubble{ border-radius:14px; }"></textarea>
      <div class="preset-row">
        <button data-preset="reset">恢复默认</button>
        <button data-preset="dark">暗色主题</button>
        <button data-preset="round">圆角气泡</button>
        <button data-preset="serif">衬线字体</button>
        <button data-preset="bg">背景图片</button>
      </div>
    </div>

    <div class="hint">
      可用变量：<br>
      <code>--wx-chat-bg</code> 聊天背景 ·
      <code>--wx-bubble-me</code> 右侧气泡 ·
      <code>--wx-bubble-other</code> 左侧气泡 ·
      <code>--wx-text</code> 文字 ·
      <code>--wx-accent</code> 主色 ·
      <code>--wx-font-size</code> 字号 ·
      <code>--wx-radius</code> 气泡圆角 ·
      <code>--wx-max-width</code> 最大宽度<br>
      也可直接写选择器：<code>.bubble</code>、<code>.chat</code>、<code>.wx-header</code>、<code>.composer</code>、<code>.avatar</code>
    </div>

    <div class="sheet-actions">
      <button class="btn-primary" id="installBtn" style="display:none;">安装到桌面</button>
    </div>
  </div>
</div>

<style id="userStyle"></style>

<script>
/* ================= 工具 ================= */
const $ = function (id) { return document.getElementById(id); };
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function isImgAvatar(a) { return /^(https?:\/\/|data:image\/|blob:)/i.test(a || ''); }
function fillAvatar(el, avatar) {
  el.innerHTML = '';
  if (isImgAvatar(avatar)) {
    const img = document.createElement('img');
    img.src = avatar;
    img.alt = '';
    el.appendChild(img);
  } else {
    el.textContent = avatar || '🙂';
  }
}

/* ================= 数据 ================= */
const KEY_MASKS = 'wx_masks_v3';
const KEY_MSGS  = 'wx_msgs_v3';
const KEY_CUR   = 'wx_current_mask_v3';
const KEY_CSS   = 'wx_user_css_v3';

function defaultMasks() {
  return [
    { id: uid(), name: '我',   avatar: '😎', side: 'right' },
    { id: uid(), name: '对方', avatar: '🙂', side: 'left'  }
  ];
}

let masks = [];
let messages = [];
let currentMaskId = null;
let editingId = null;
let editSide = 'right';

try {
  masks = JSON.parse(localStorage.getItem(KEY_MASKS) || 'null') || defaultMasks();
  messages = JSON.parse(localStorage.getItem(KEY_MSGS) || '[]');
  currentMaskId = localStorage.getItem(KEY_CUR);
} catch (e) {
  masks = defaultMasks();
  messages = [];
}
if (!Array.isArray(masks) || !masks.length) masks = defaultMasks();
if (!masks.some(function (m) { return m.id === currentMaskId; })) currentMaskId = masks[0].id;

function save() {
  localStorage.setItem(KEY_MASKS, JSON.stringify(masks));
  localStorage.setItem(KEY_MSGS, JSON.stringify(messages));
  localStorage.setItem(KEY_CUR, currentMaskId);
}
function getMask(id) {
  return masks.find(function (m) { return m.id === id; })
      || { name: '未知面具', avatar: '❓', side: 'left' };
}

/* ================= 元素 ================= */
const chatEl         = $('chat');
const inputEl        = $('msgInput');
const sendBtn        = $('sendBtn');
const clearBtn       = $('clearBtn');
const settingsBtn    = $('settingsBtn');
const currentMaskBtn = $('currentMaskBtn');
const maskPanelBtn   = $('maskPanelBtn');
const quickSwitchBtn = $('quickSwitchBtn');
const maskListEl     = $('maskList');
const maskSheet      = $('maskSheet');
const editSheet      = $('editSheet');
const settingsSheet  = $('settingsSheet');
const overlay        = $('overlay');
const newMaskBtn     = $('newMaskBtn');
const editTitle      = $('editTitle');
const nameInput      = $('nameInput');
const avatarInput    = $('avatarInput');
const saveMaskBtn    = $('saveMaskBtn');
const deleteMaskBtn  = $('deleteMaskBtn');
const sideButtons    = document.querySelectorAll('.side-choice button');
const cssEditor      = $('cssEditor');
const userStyleEl    = $('userStyle');
const installBtn     = $('installBtn');

/* ================= 渲染 ================= */
function renderChat() {
  chatEl.innerHTML = '';
  if (!messages.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '开始自己和自己对话吧～';
    chatEl.appendChild(empty);
    return;
  }
  messages.forEach(function (msg) {
    const mask = getMask(msg.maskId);
    const isRight = mask.side === 'right';

    const row = document.createElement('div');
    row.className = 'message ' + (isRight ? 'me' : 'other');

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    fillAvatar(avatar, mask.avatar);

    const content = document.createElement('div');
    content.className = 'content';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = mask.name;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text;

    content.appendChild(name);
    content.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(content);
    chatEl.appendChild(row);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderIdentityBar() {
  const m = getMask(currentMaskId);

  currentMaskBtn.innerHTML = '';
  const av = document.createElement('span');
  av.className = 'mini-avatar';
  fillAvatar(av, m.avatar);
  const nm = document.createElement('span');
  nm.className = 'mask-name';
  nm.textContent = m.name;
  currentMaskBtn.appendChild(av);
  currentMaskBtn.appendChild(nm);

  quickSwitchBtn.innerHTML = '';
  fillAvatar(quickSwitchBtn, m.avatar);

  inputEl.placeholder = '以「' + m.name + '」的身份输入...';
  document.title = m.name + ' · 面具对话';
}

function renderMaskList() {
  maskListEl.innerHTML = '';
  masks.forEach(function (m) {
    const row = document.createElement('div');
    row.className = 'mask-row' + (m.id === currentMaskId ? ' active' : '');

    const av = document.createElement('div');
    av.className = 'mask-avatar';
    fillAvatar(av, m.avatar);

    const info = document.createElement('div');
    info.className = 'mask-info';

    const nm = document.createElement('div');
    nm.className = 'mask-name';
    nm.textContent = m.name;

    const meta = document.createElement('div');
    meta.className = 'mask-meta';
    meta.textContent = (m.side === 'right' ? '显示在右侧' : '显示在左侧')
                     + (m.id === currentMaskId ? ' · 当前身份' : '');

    info.appendChild(nm);
    info.appendChild(meta);

    const edit = document.createElement('button');
    edit.className = 'mask-edit';
    edit.textContent = '编辑';
    edit.addEventListener('click', function (e) {
      e.stopPropagation();
      openEdit(m.id);
    });

    row.appendChild(av);
    row.appendChild(info);
    row.appendChild(edit);

    row.addEventListener('click', function () {
      currentMaskId = m.id;
      save();
      renderAll();
      closeAllSheets();
      inputEl.focus();
    });

    maskListEl.appendChild(row);
  });
}

function renderAll() {
  renderIdentityBar();
  renderChat();
  renderMaskList();
}

/* ================= 弹层 ================= */
function openSheet(el) {
  document.querySelectorAll('.sheet').forEach(function (s) {
    if (s !== el) s.classList.remove('show');
  });
  overlay.classList.add('show');
  el.classList.add('show');
}
function closeAllSheets() {
  document.querySelectorAll('.sheet').forEach(function (s) { s.classList.remove('show'); });
  overlay.classList.remove('show');
}
overlay.addEventListener('click', closeAllSheets);

/* ================= 编辑面具 ================= */
function openEdit(id) {
  editingId = id || null;
  let m;
  if (editingId) {
    m = masks.find(function (x) { return x.id === editingId; });
    if (!m) return;
    editTitle.textContent = '编辑面具';
    deleteMaskBtn.style.display = 'block';
  } else {
    m = { name: '', avatar: '🙂', side: 'left' };
    editTitle.textContent = '新建面具';
    deleteMaskBtn.style.display = 'none';
  }
  nameInput.value = m.name;
  avatarInput.value = m.avatar;
  editSide = m.side;
  renderSideChoice();
  openSheet(editSheet);
  setTimeout(function () { nameInput.focus(); }, 250);
}
function renderSideChoice() {
  sideButtons.forEach(function (b) {
    b.classList.toggle('active', b.dataset.side === editSide);
  });
}
sideButtons.forEach(function (b) {
  b.addEventListener('click', function () {
    editSide = b.dataset.side;
    renderSideChoice();
  });
});

function saveEdit() {
  const name = nameInput.value.trim() || '未命名';
  const avatar = avatarInput.value.trim() || '🙂';
  if (editingId) {
    const m = masks.find(function (x) { return x.id === editingId; });
    if (m) { m.name = name; m.avatar = avatar; m.side = editSide; }
  } else {
    const m = { id: uid(), name: name, avatar: avatar, side: editSide };
    masks.push(m);
    currentMaskId = m.id;
  }
  save();
  renderAll();
  closeAllSheets();
}

function removeMask() {
  if (!editingId) return;
  const m = masks.find(function (x) { return x.id === editingId; });
  if (!m) return;
  if (masks.length <= 1) { alert('至少要保留一个面具'); return; }
  if (!confirm('删除面具「' + m.name + '」？\n这个面具发过的消息也会一起删掉。')) return;

  masks = masks.filter(function (x) { return x.id !== editingId; });
  messages = messages.filter(function (x) { return x.maskId !== editingId; });
  if (currentMaskId === editingId) currentMaskId = masks[0].id;

  save();
  renderAll();
  closeAllSheets();
}

/* ================= 发送 ================= */
function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  messages.push({ maskId: currentMaskId, text: text, time: Date.now() });
  inputEl.value = '';
  save();
  renderChat();
  inputEl.focus();
}
sendBtn.addEventListener('click', send);

/* ================= PWA ================= */
function makeIcon(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  ctx.fillStyle = '#07c160';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#ffffff';
  rr(size * 0.14, size * 0.20, size * 0.52, size * 0.38, size * 0.10);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  rr(size * 0.38, size * 0.48, size * 0.48, size * 0.32, size * 0.09);
  ctx.fill();
  return c.toDataURL('image/png');
}

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', function () {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function () {
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
});

  installBtn.style.display = 'none';
  deferredPrompt = null;
});
