<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ededed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="微信">
<title>微信</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<style>
:root{
  --wx-bg:#ededed;
  --wx-card:#ffffff;
  --wx-line:rgba(0,0,0,.08);
  --wx-text:#191919;
  --wx-text2:#888888;
  --wx-text3:#b2b2b2;
  --wx-green:#07c160;
  --wx-blue:#576b95;
  --wx-red:#fa5151;
  --wx-nav:#ededed;

  /* 用户可覆盖 */
  --wx-bubble-me:#95ec69;
  --wx-bubble-other:#ffffff;
  --wx-chat-bg:#ededed;
  --wx-radius:6px;
  --wx-font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  color:var(--wx-text);
  background:#000;
  -webkit-font-smoothing:antialiased;
}
.app{
  position:relative;
  width:100%;max-width:520px;
  height:100vh;height:100dvh;
  margin:0 auto;
  background:var(--wx-bg);
  overflow:hidden;
}

/* ============ 主视图 ============ */
.main-view{position:absolute;inset:0;display:flex;flex-direction:column;}
.page{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  background:var(--wx-bg);
}
.page.active{display:flex;}

/* 微信导航栏 */
.nav{
  flex-shrink:0;position:relative;
  height:calc(44px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:var(--wx-nav);
  border-bottom:.5px solid var(--wx-line);
  display:flex;align-items:center;justify-content:center;
  z-index:5;
}
.nav-title{font-size:17px;font-weight:500;color:var(--wx-text);}
.nav-right{
  position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 10px);
  height:26px;min-width:26px;
  display:flex;align-items:center;gap:16px;
  font-size:22px;color:#191919;line-height:1;
}
.nav-right button{
  border:0;background:transparent;color:#191919;
  font-size:22px;line-height:1;padding:0;cursor:pointer;
}
.nav-back{
  position:absolute;left:6px;top:calc(env(safe-area-inset-top) + 6px);
  width:36px;height:32px;border:0;background:transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#191919;cursor:pointer;
}

/* 滚动区域 */
.scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}

/* 微信列表项 */
.cell{
  display:flex;align-items:center;gap:12px;
  background:var(--wx-card);
  padding:11px 16px;
  min-height:54px;
  cursor:pointer;
  position:relative;
}
.cell + .cell::before{
  content:'';position:absolute;left:16px;right:0;top:0;
  height:.5px;background:var(--wx-line);
}
.cell:active{background:#f5f5f5;}
.cell-icon{
  width:24px;height:24px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
}
.cell-title{flex:1;font-size:16.5px;color:var(--wx-text);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cell-value{font-size:15px;color:var(--wx-text2);margin-left:auto;flex-shrink:0;}
.cell-arrow{color:#c8c8cd;font-size:17px;margin-left:2px;flex-shrink:0;}
.cell.center{justify-content:center;font-size:16.5px;}
.cell.center .cell-title{flex:none;text-align:center;}
.cell.danger .cell-title{color:var(--wx-red);}
.cell.green .cell-title{color:var(--wx-green);}

/* 分组间距 */
.group{background:var(--wx-card);margin-bottom:8px;}

/* 头像 */
.avatar{
  width:48px;height:48px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;overflow:hidden;background:#d8d8d8;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar.sm{width:38px;height:38px;font-size:20px;border-radius:4px;}
.avatar.lg{width:64px;height:64px;font-size:34px;border-radius:6px;}

/* 聊天列表项 */
.chat-item{
  display:flex;align-items:center;gap:12px;
  background:var(--wx-card);
  padding:11px 16px;
  min-height:72px;
  cursor:pointer;
  position:relative;
}
.chat-item:active{background:#f5f5f5;}
.chat-item + .chat-item::before{
  content:'';position:absolute;left:76px;right:0;top:0;
  height:.5px;background:var(--wx-line);
}
.chat-main{flex:1;min-width:0;}
.chat-top{display:flex;align-items:baseline;gap:8px;}
.chat-name{
  flex:1;min-width:0;font-size:16.5px;font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chat-time{font-size:12px;color:var(--wx-text3);flex-shrink:0;}
.chat-preview{
  font-size:14px;color:var(--wx-text2);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chat-preview.muted{color:var(--wx-text3);}

/* 空状态 */
.empty{
  padding:80px 20px;text-align:center;
  color:var(--wx-text3);font-size:14px;line-height:1.9;
}

/* 搜索框 */
.search-wrap{padding:8px 12px;background:var(--wx-bg);}
.search-box{
  height:36px;border-radius:6px;background:var(--wx-card);
  display:flex;align-items:center;gap:6px;padding:0 10px;
  font-size:14px;color:var(--wx-text3);
}

/* ============ 底部液态玻璃 Tab ============ */
.tabbar{
  position:absolute;
  left:14px;right:14px;
  bottom:calc(10px + env(safe-area-inset-bottom));
  height:60px;
  z-index:50;
  display:flex;align-items:center;
  border-radius:24px;
  overflow:hidden;

  background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.48));
  -webkit-backdrop-filter:blur(34px) saturate(210%);
  backdrop-filter:blur(34px) saturate(210%);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:
    0 12px 34px rgba(20,30,60,.16),
    0 3px 10px rgba(20,30,60,.07),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.4);
}
.tabbar::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,
    rgba(255,255,255,.85) 0%,
    rgba(255,255,255,0) 32%,
    rgba(255,255,255,0) 64%,
    rgba(255,255,255,.5) 100%);
  opacity:.6;
}
.tabbar::after{
  content:'';position:absolute;left:12%;right:12%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
}
.tab-item{
  position:relative;z-index:2;
  flex:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:0;background:transparent;
  color:#8b929d;font-size:10px;font-weight:500;
  transition:color .2s, transform .2s;
  cursor:pointer;
}
.tab-item:active{transform:scale(.92);}
.tab-item svg{width:24px;height:24px;fill:currentColor;transition:transform .2s;}
.tab-item.active{color:var(--wx-green);}
.tab-item.active svg{transform:translateY(-1px);}
.tab-item.active::after{
  content:'';position:absolute;bottom:5px;width:14px;height:2.5px;border-radius:3px;
  background:var(--wx-green);opacity:.85;
  box-shadow:0 0 8px rgba(7,193,96,.55);
}

/* ============ 子页面（栈） ============ */
.sub-view{
  position:absolute;inset:0;z-index:100;
  background:var(--wx-bg);
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sub-view.show{transform:none;}
.sub-page{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:var(--wx-bg);
}

/* ============ 聊天页 ============ */
.msg-scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 12px 16px;
  background:var(--wx-chat-bg);
}
.msg{display:flex;align-items:flex-start;gap:9px;margin-bottom:16px;}
.msg.me{flex-direction:row-reverse;}
.msg .avatar{width:40px;height:40px;border-radius:4px;font-size:22px;}
.msg-content{max-width:74%;display:flex;flex-direction:column;min-width:0;}
.msg.me .msg-content{align-items:flex-end;}
.msg-name{font-size:11px;color:var(--wx-text3);margin-bottom:4px;padding:0 4px;}
.bubble{
  padding:9px 12px;
  border-radius:var(--wx-radius);
  font-size:var(--wx-font-size);
  line-height:1.45;
  word-break:break-word;
  white-space:pre-wrap;
  background:var(--wx-bubble-other);
  color:var(--wx-text);
  position:relative;
}
.bubble::before{
  content:'';position:absolute;top:11px;
  width:0;height:0;border:5px solid transparent;
}
.msg.me .bubble{background:var(--wx-bubble-me);}
.msg:not(.me) .bubble::before{
  left:-9px;border-right-color:var(--wx-bubble-other);
}
.msg.me .bubble::before{
  right:-9px;border-left-color:var(--wx-bubble-me);
}
.msg-name.hide{display:none;}

.composer{
  flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  background:#f7f7f7;
  border-top:.5px solid var(--wx-line);
}
.composer-mask{
  width:36px;height:36px;border-radius:5px;flex-shrink:0;
  border:0;background:#dcdcdc;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;
}
.composer-mask img{width:100%;height:100%;object-fit:cover;display:block;}
#msgInput{
  flex:1;min-width:0;height:38px;
  border:0;border-radius:5px;
  padding:0 10px;font-size:16px;
  background:#fff;outline:none;color:var(--wx-text);
}
.send-btn{
  height:38px;padding:0 16px;flex-shrink:0;
  border:0;border-radius:5px;
  background:var(--wx-green);color:#fff;
  font-size:15px;cursor:pointer;
}
.send-btn:active{opacity:.8;}

/* ============ 我 ============ */
.me-header{
  display:flex;align-items:center;gap:14px;
  background:var(--wx-card);
  padding:20px 16px;
  margin-bottom:8px;
  cursor:pointer;
}
.me-header:active{background:#f5f5f5;}
.me-info{flex:1;min-width:0;}
.me-name{font-size:20px;font-weight:500;}
.me-id{font-size:13px;color:var(--wx-text2);margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ============ 朋友圈 ============ */
.moment-cover{
  height:190px;position:relative;
  display:flex;align-items:flex-end;
  padding:16px;
  background:
    radial-gradient(120% 100% at 20% 0%, rgba(120,170,255,.9), transparent 60%),
    radial-gradient(120% 100% at 90% 30%, rgba(255,150,205,.85), transparent 60%),
    linear-gradient(135deg, #9fd0ff, #b6a8ff 45%, #ffb4d8);
}
.moment-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.35));
}
.moment-cover .who{
  position:relative;z-index:2;display:flex;align-items:center;gap:10px;color:#fff;
}
.moment-cover .who .avatar{
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 6px 18px rgba(0,0,0,.2);
}
.moment-cover .who b{font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.35);}
.moment-list{padding:10px 12px 100px;}
.moment{
  background:var(--wx-card);
  padding:14px;border-radius:10px;
  margin-bottom:10px;
}
.moment-head{display:flex;gap:11px;}
.moment-head .avatar{width:42px;height:42px;font-size:22px;}
.moment-body{flex:1;min-width:0;}
.moment-name{font-size:14.5px;font-weight:600;color:#3b5bdb;margin-bottom:5px;}
.moment-text{font-size:15px;line-height:1.6;word-break:break-word;white-space:pre-wrap;}
.moment-img{margin-top:9px;border-radius:8px;overflow:hidden;max-height:280px;}
.moment-img img{width:100%;display:block;object-fit:cover;}
.moment-foot{
  display:flex;align-items:center;gap:14px;
  margin-top:10px;padding-top:9px;
  border-top:.5px solid var(--wx-line);
  font-size:12.5px;color:var(--wx-text3);
}
.moment-act{
  border:0;background:transparent;color:var(--wx-text2);
  font-size:12.5px;padding:3px 0;display:flex;align-items:center;gap:4px;cursor:pointer;
}
.moment-act.on{color:#e0245e;}
.moment-time{margin-left:auto;}

/* ============ 弹层 ============ */
.overlay{
  position:fixed;inset:0;z-index:180;
  background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:181;
  max-width:520px;margin:0 auto;
  border-radius:16px 16px 0 0;
  background:#fff;
  transform:translateY(110%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  max-height:88vh;
  padding-bottom:env(safe-area-inset-bottom);
  overflow:hidden;
}
.sheet.show{transform:none;}
.sheet-head{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;
  font-size:16px;font-weight:600;
  border-bottom:.5px solid var(--wx-line);
}
.sheet-head button{
  border:0;background:transparent;color:var(--wx-green);
  font-size:15px;font-weight:500;cursor:pointer;
}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.field{
  padding:13px 18px;display:flex;align-items:center;gap:12px;
  border-bottom:.5px solid var(--wx-line);
}
.field label{width:56px;flex-shrink:0;font-size:15px;color:var(--wx-text2);}
.field input[type=text],.field textarea{
  flex:1;min-width:0;border:0;outline:none;
  font-size:16px;background:transparent;color:var(--wx-text);
  font-family:inherit;
}
.field textarea{resize:vertical;min-height:88px;line-height:1.6;}
.side-choice{display:flex;gap:8px;}
.side-choice button{
  border:1px solid #ddd;background:#fff;
  border-radius:15px;padding:6px 15px;font-size:14px;color:var(--wx-text);cursor:pointer;
}
.side-choice button.on{background:var(--wx-green);border-color:var(--wx-green);color:#fff;}
.sheet-actions{padding:16px 18px;display:flex;gap:10px;flex-shrink:0;}
.sheet-actions button{
  flex:1;height:46px;border-radius:8px;border:0;font-size:16px;cursor:pointer;
}
.btn-primary{background:var(--wx-green);color:#fff;}
.btn-plain{background:#f2f2f2;color:var(--wx-text);}
.btn-danger{background:#fff;color:var(--wx-red);border:1px solid #f0c0bf;}

#cssEditor{
  width:100%;min-height:200px;resize:vertical;
  border:1px solid #e0e0e0;border-radius:8px;
  background:#fafafa;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.6;padding:12px;outline:none;color:#1a1d23;
}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.presets button{
  border:1px solid #ddd;background:#fff;
  border-radius:15px;padding:6px 13px;font-size:12.5px;color:var(--wx-text);cursor:pointer;
}
.hint{font-size:12px;color:var(--wx-text3);line-height:1.7;padding:12px 18px;}
.hint code{background:#f2f2f2;border-radius:3px;padding:1px 5px;font-size:11.5px;color:#c7254e;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:120px;transform:translate(-50%,16px);
  z-index:300;padding:10px 20px;border-radius:8px;
  font-size:14px;color:#fff;background:rgba(0,0,0,.75);
  opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ================= 主视图 ================= -->
  <div class="main-view">

    <!-- 1. 微信 -->
    <section class="page active" id="page-wechat">
      <header class="nav">
        <div class="nav-title">微信</div>
        <div class="nav-right"><button id="btnNewChat">＋</button></div>
      </header>
      <div class="scroll">
        <div id="chatList"></div>
      </div>
    </section>

    <!-- 2. 通讯录 -->
    <section class="page" id="page-contacts">
      <header class="nav">
        <div class="nav-title">通讯录</div>
        <div class="nav-right"><button id="btnNewContact">＋</button></div>
      </header>
      <div class="scroll">
        <div class="search-wrap"><div class="search-box">🔍 搜索</div></div>
        <div id="contactList"></div>
      </div>
    </section>

    <!-- 3. 发现 -->
    <section class="page" id="page-discover">
      <header class="nav"><div class="nav-title">发现</div></header>
      <div class="scroll">
        <div class="group">
          <div class="cell" data-go="moments">
            <span class="cell-icon">🌈</span>
            <span class="cell-title">朋友圈</span>
            <span class="cell-arrow">›</span>
          </div>
        </div>
        <div class="group">
          <div class="cell"><span class="cell-icon">📺</span><span class="cell-title">视频号</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-icon">🎥</span><span class="cell-title">直播</span><span class="cell-arrow">›</span></div>
        </div>
        <div class="group">
          <div class="cell"><span class="cell-icon">📷</span><span class="cell-title">扫一扫</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-icon">📳</span><span class="cell-title">摇一摇</span><span class="cell-arrow">›</span></div>
        </div>
        <div class="group">
          <div class="cell"><span class="cell-icon">👀</span><span class="cell-title">看一看</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-icon">🔎</span><span class="cell-title">搜一搜</span><span class="cell-arrow">›</span></div>
        </div>
        <div class="group">
          <div class="cell"><span class="cell-icon">🛍️</span><span class="cell-title">购物</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-icon">🎮</span><span class="cell-title">游戏</span><span class="cell-arrow">›</span></div>
        </div>
      </div>
    </section>

    <!-- 4. 我 -->
    <section class="page" id="page-me">
      <header class="nav"><div class="nav-title">我</div></header>
      <div class="scroll">
        <div class="me-header" id="meHeader">
          <div class="avatar lg" id="meAvatar"></div>
          <div class="me-info">
            <div class="me-name" id="meName">我</div>
            <div class="me-id" id="meId">微信号：mask_me</div>
          </div>
          <span class="cell-arrow">›</span>
        </div>

        <div class="group">
          <div class="cell"><span class="cell-icon">💳</span><span class="cell-title">服务</span><span class="cell-arrow">›</span></div>
        </div>

        <div class="group">
          <div class="cell"><span class="cell-icon">⭐</span><span class="cell-title">收藏</span><span class="cell-arrow">›</span></div>
          <div class="cell" data-go="moments"><span class="cell-icon">🌈</span><span class="cell-title">朋友圈</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-icon">🎴</span><span class="cell-title">卡包</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-icon">😀</span><span class="cell-title">表情</span><span class="cell-arrow">›</span></div>
        </div>

        <div class="group">
          <div class="cell" data-go="settings">
            <span class="cell-icon">⚙️</span>
            <span class="cell-title">设置</span>
            <span class="cell-arrow">›</span>
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- ================= 液态玻璃底部 Tab ================= -->
  <nav class="tabbar" id="tabbar">
    <button class="tab-item active" data-tab="wechat">
      <svg viewBox="0 0 24 24"><path d="M8.7 3.2C4.9 3.2 1.8 5.8 1.8 9c0 1.85 1.05 3.5 2.7 4.6l-.7 2.1 2.45-1.25c.8.22 1.65.34 2.55.34h.4a5.9 5.9 0 0 1-.28-1.8c0-3.1 3.05-5.6 6.8-5.6h.5C15.5 5.2 12.4 3.2 8.7 3.2zm-2.4 3.4a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9zm4.9 0a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9z"/><path d="M22.2 13.1c0-2.6-2.55-4.7-5.7-4.7s-5.7 2.1-5.7 4.7 2.55 4.7 5.7 4.7c.65 0 1.3-.1 1.9-.28l2 1.02-.55-1.8c1.4-.86 2.35-2.1 2.35-3.64zm-7.6-1.5a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6zm3.8 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6z"/></svg>
      <span>微信</span>
    </button>
    <button class="tab-item" data-tab="contacts">
      <svg viewBox="0 0 24 24"><path d="M12 12.2c2.3 0 4.2-1.9 4.2-4.2S14.3 3.8 12 3.8 7.8 5.7 7.8 8s1.9 4.2 4.2 4.2zm0 2c-3 0-8 1.5-8 4.4v2.1h16v-2.1c0-2.9-5-4.4-8-4.4z"/></svg>
      <span>通讯录</span>
    </button>
    <button class="tab-item" data-tab="discover">
      <svg viewBox="0 0 24 24"><path d="M12 2.5A9.5 9.5 0 1 0 21.5 12 9.5 9.5 0 0 0 12 2.5zm0 17.2A7.7 7.7 0 1 1 19.7 12 7.7 7.7 0 0 1 12 19.7z"/><path d="M15.9 8.1l-2.3 5.5-5.5 2.3 2.3-5.5 5.5-2.3zM12 11.1a.9.9 0 1 0 .9.9.9.9 0 0 0-.9-.9z"/></svg>
      <span>发现</span>
    </button>
    <button class="tab-item" data-tab="me">
      <svg viewBox="0 0 24 24"><path d="M12 12.4c2.4 0 4.4-2 4.4-4.4S14.4 3.6 12 3.6 7.6 5.6 7.6 8s2 4.4 4.4 4.4zm0 2.1c-3.2 0-8.4 1.6-8.4 4.8v2.1h16.8v-2.1c0-3.2-5.2-4.8-8.4-4.8z"/></svg>
      <span>我</span>
    </button>
  </nav>

  <!-- ================= 子页面栈 ================= -->
  <div class="sub-view" id="subView"></div>

</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<style id="userStyle"></style>

<script>
/* ============ 工具 ============ */
const $  = (s, r) => (r || document).querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isImg = a => /^(https?:\/\/|data:image\/|blob:)/i.test(a || '');

function setAvatar(el, a) {
  if (!el) return;
  el.innerHTML = '';
  if (isImg(a)) {
    const img = document.createElement('img');
    img.src = a; img.alt = '';
    el.appendChild(img);
  } else {
    el.textContent = a || '🙂';
  }
}
const pad = n => String(n).padStart(2, '0');
function fmtTime(t) {
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.getFullYear() === n.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}
function relTime(t) {
  const diff = Date.now() - t;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
  const d = new Date(t);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* ============ 状态 ============ */
const LS_KEY = 'wechat_real_v1';
let state = {
  masks: [],
  messages: [],
  moments: [],
  currentMaskId: null,
  tab: 'wechat',
  css: ''
};
function defaultMasks() {
  return [
    { id: uid(), name: '我',   avatar: '😎', side: 'right' },
    { id: uid(), name: '对方', avatar: '🙂', side: 'left'  }
  ];
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch (e) {}
  if (!Array.isArray(state.masks) || !state.masks.length) state.masks = defaultMasks();
  if (!Array.isArray(state.messages)) state.messages = [];
  if (!Array.isArray(state.moments)) state.moments = [];
  if (!state.currentMaskId || !state.masks.some(m => m.id === state.currentMaskId)) {
    state.currentMaskId = state.masks[0].id;
  }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
const getMask = id => state.masks.find(m => m.id === id)
  || { id: 'x', name: '未知', avatar: '❓', side: 'left' };
const currentMask = () => getMask(state.currentMaskId);

/* ============ 主 Tab 切换 ============ */
function switchTab(name) {
  state.tab = name;
  save();
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + name);
  });
  document.querySelectorAll('.tab-item').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  if (name === 'wechat')   renderChatList();
  if (name === 'contacts') renderContacts();
  if (name === 'me')       renderMe();
}
document.querySelectorAll('.tab-item').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});

/* ============ 微信 Tab：聊天列表 ============ */
function renderChatList() {
  const wrap = $('#chatList');
  wrap.innerHTML = '';

  const lastByMask = {};
  state.messages.forEach(m => { lastByMask[m.maskId] = m; });

  const rows = state.masks.slice().sort((a, b) => {
    const ta = lastByMask[a.id] ? lastByMask[a.id].time : 0;
    const tb = lastByMask[b.id] ? lastByMask[b.id].time : 0;
    return tb - ta;
  });

  if (!rows.length) {
    wrap.innerHTML = '<div class="empty">还没有面具<br>点右上角 ＋ 创建一个</div>';
    return;
  }

  rows.forEach(mask => {
    const last = lastByMask[mask.id];
    const item = el('div', 'chat-item');

    const av = el('div', 'avatar');
    setAvatar(av, mask.avatar);

    const main = el('div', 'chat-main');
    const top = el('div', 'chat-top');
    const nm = el('span', 'chat-name', mask.name);
    const tm = el('span', 'chat-time', last ? fmtTime(last.time) : '');
    top.appendChild(nm);
    top.appendChild(tm);

    const pv = el('div', 'chat-preview' + (last ? '' : ' muted'),
                  last ? last.text : '还没有消息');
    main.appendChild(top);
    main.appendChild(pv);

    item.appendChild(av);
    item.appendChild(main);
    item.addEventListener('click', () => {
      state.currentMaskId = mask.id;
      save();
      push('chat');
    });
    wrap.appendChild(item);
  });
}

/* ============ 通讯录 ============ */
function renderContacts() {
  const wrap = $('#contactList');
  wrap.innerHTML = '';

  const g1 = el('div', 'group');
  ['新的朋友', '群聊', '标签', '公众号'].forEach((t, i) => {
    const icons = ['👤', '👥', '🏷️', '📢'];
    const c = el('div', 'cell');
    c.appendChild(el('span', 'cell-icon', icons[i]));
    c.appendChild(el('span', 'cell-title', t));
    c.appendChild(el('span', 'cell-arrow', '›'));
    g1.appendChild(c);
  });
  wrap.appendChild(g1);

  const g2 = el('div', 'group');
  state.masks.forEach(mask => {
    const c = el('div', 'cell');
    const av = el('div', 'avatar sm');
    setAvatar(av, mask.avatar);
    const t = el('span', 'cell-title',
      mask.name + (mask.id === state.currentMaskId ? ' · 当前' : ''));
    const arrow = el('span', 'cell-arrow', '›');
    c.appendChild(av);
    c.appendChild(t);
    c.appendChild(arrow);
    c.addEventListener('click', () => {
      state.currentMaskId = mask.id;
      save();
      push('chat');
    });
    g2.appendChild(c);
  });
  wrap.appendChild(g2);
}

/* ============ 我 ============ */
function renderMe() {
  const m = currentMask();
  setAvatar($('#meAvatar'), m.avatar);
  $('#meName').textContent = m.name;
  $('#meId').textContent = '微信号：mask_' + (m.id || '').slice(-6);
}

/* ============ 子页面栈 ============ */
const subStack = [];
const subView = $('#subView');

function push(name, params) {
  const first = subStack.length === 0;
  subStack.push({ name, params: params || {} });
  if (first) {
    subView.classList.remove('show');
    renderSub();
    requestAnimationFrame(() => subView.classList.add('show'));
  } else {
    renderSub();
  }
}
function pop() {
  subStack.pop();
  if (!subStack.length) {
    subView.classList.remove('show');
    setTimeout(() => { subView.innerHTML = ''; }, 300);
    return;
  }
  renderSub();
}
function renderSub() {
  const top = subStack[subStack.length - 1];
  subView.innerHTML = '';
  if (!top) return;
  const page = buildPage(top.name, top.params);
  if (page) subView.appendChild(page);
}

/* 通用子页面外壳 */
function subShell(title, rightBtn, bodyBuilder, onBack) {
  const page = el('div', 'sub-page');

  const nav = el('header', 'nav');
  const back = el('button', 'nav-back', '‹');
  back.addEventListener('click', () => onBack ? onBack() : pop());
  nav.appendChild(back);

  const t = el('div', 'nav-title', title);
  nav.appendChild(t);

  if (rightBtn) {
    const r = el('div', 'nav-right');
    const b = el('button', null, rightBtn.text);
    b.addEventListener('click', rightBtn.onClick);
    r.appendChild(b);
    nav.appendChild(r);
  }
  page.appendChild(nav);

  const scroll = el('div', 'scroll');
  bodyBuilder(scroll);
  page.appendChild(scroll);

  return page;
}

function buildPage(name, params) {
  if (name === 'chat')      return buildChatPage();
  if (name === 'settings')  return buildSettingsPage();
  if (name === 'switchMask') return buildSwitchMaskPage();
  if (name === 'maskEdit')  return buildMaskEditPage(params);
  if (name === 'moments')   return buildMomentsPage();
  if (name === 'css')       return buildCssPage();
  return null;
}

/* ============ 聊天页 ============ */
function buildChatPage() {
  const mask = currentMask();

  const page = el('div', 'sub-page');

  const nav = el('header', 'nav');
  const back = el('button', 'nav-back', '‹');
  back.addEventListener('click', pop);
  nav.appendChild(back);
  nav.appendChild(el('div', 'nav-title', mask.name));
  const right = el('div', 'nav-right');
  const switchBtn = el('button', null, '☰');
  switchBtn.addEventListener('click', () => push('switchMask'));
  right.appendChild(switchBtn);
  nav.appendChild(right);
  page.appendChild(nav);

  const scroll = el('div', 'msg-scroll');
  scroll.id = 'msgScroll';
  page.appendChild(scroll);

  const composer = el('div', 'composer');
  const cm = el('button', 'composer-mask');
  setAvatar(cm, mask.avatar);
  cm.addEventListener('click', () => push('switchMask'));

  const input = el('input');
  input.id = 'msgInput';
  input.type = 'text';
  input.placeholder = '以「' + mask.name + '」的身份输入...';
  input.autocomplete = 'off';
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  const send = el('button', 'send-btn', '发送');
  send.addEventListener('click', sendMessage);

  composer.appendChild(cm);
  composer.appendChild(input);
  composer.appendChild(send);
  page.appendChild(composer);

  renderMessages(scroll);
  setTimeout(() => input.focus(), 320);

  return page;
}

function renderMessages(scrollEl) {
  const box = scrollEl || $('#msgScroll');
  if (!box) return;
  box.innerHTML = '';

  if (!state.messages.length) {
    box.innerHTML = '<div class="empty" style="color:#999;padding:60px 0;">开始自己和自己对话吧～<br>点左下角头像可以切换身份</div>';
    return;
  }

  state.messages.forEach(m => {
    const mask = getMask(m.maskId);
    const isRight = mask.side === 'right';

    const row = el('div', 'msg ' + (isRight ? 'me' : 'other'));
    const av = el('div', 'avatar');
    setAvatar(av, mask.avatar);

    const content = el('div', 'msg-content');
    const nm = el('div', 'msg-name', mask.name);
    const bub = el('div', 'bubble', m.text);

    content.appendChild(nm);
    content.appendChild(bub);
    row.appendChild(av);
    row.appendChild(content);
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = $('#msgInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  state.messages.push({
    maskId: state.currentMaskId,
    text,
    time: Date.now()
  });
  input.value = '';
  save();

  renderMessages();
  input.focus();
}

/* ============ 设置页 ============ */
function buildSettingsPage() {
  return subShell('设置', null, scroll => {
    const g1 = el('div', 'group');
    ['账号与安全', '新消息通知', '隐私', '通用'].forEach(t => {
      const c = el('div', 'cell');
      c.appendChild(el('span', 'cell-title', t));
      c.appendChild(el('span', 'cell-arrow', '›'));
      g1.appendChild(c);
    });
    scroll.appendChild(g1);

    const g2 = el('div', 'group');
    const c1 = el('div', 'cell');
    c1.appendChild(el('span', 'cell-title', '切换面具'));
    c1.appendChild(el('span', 'cell-value', currentMask().name));
    c1.appendChild(el('span', 'cell-arrow', '›'));
    c1.addEventListener('click', () => push('switchMask'));
    g2.appendChild(c1);

    const c2 = el('div', 'cell');
    c2.appendChild(el('span', 'cell-title', '自定义 CSS'));
    c2.appendChild(el('span', 'cell-arrow', '›'));
    c2.addEventListener('click', () => push('css'));
    g2.appendChild(c2);
    scroll.appendChild(g2);

    const g3 = el('div', 'group');
    const c3 = el('div', 'cell');
    c3.appendChild(el('span', 'cell-title', '导出数据'));
    c3.appendChild(el('span', 'cell-arrow', '›'));
    c3.addEventListener('click', exportData);
    g3.appendChild(c3);

    const c4 = el('div', 'cell');
    c4.appendChild(el('span', 'cell-title', '导入数据'));
    c4.appendChild(el('span', 'cell-arrow', '›'));
    c4.addEventListener('click', importData);
    g3.appendChild(c4);

    const c5 = el('div', 'cell');
    c5.appendChild(el('span', 'cell-title', '清空全部记录'));
    c5.appendChild(el('span', 'cell-arrow', '›'));
    c5.addEventListener('click', () => {
      if (!confirm('清空全部聊天和动态？（面具会保留）')) return;
      state.messages = [];
      state.moments = [];
      save();
      toast('已清空');
    });
    g3.appendChild(c5);
    scroll.appendChild(g3);

    const g4 = el('div', 'group');
    const c6 = el('div', 'cell');
    c6.appendChild(el('span', 'cell-title', '关于面具微信'));
    c6.appendChild(el('span', 'cell-arrow', '›'));
    g4.appendChild(c6);
    scroll.appendChild(g4);

    const g5 = el('div', 'group');
    const out = el('div', 'cell center');
    out.appendChild(el('span', 'cell-title', '退出登录'));
    out.style.color = 'var(--wx-red)';
    out.addEventListener('click', () => toast('这只是个模拟器 :)'));
    g5.appendChild(out);
    scroll.appendChild(g5);
  });
}

/* ============ 切换面具页（重点） ============ */
function buildSwitchMaskPage() {
  return subShell('切换面具', {
    text: '＋',
    onClick: () => push('maskEdit', { id: null })
  }, scroll => {

    const g = el('div', 'group');

    state.masks.forEach(mask => {
      const c = el('div', 'cell');

      const av = el('div', 'avatar sm');
      setAvatar(av, mask.avatar);

      const info = el('div', 'cell-title');
      info.style.display = 'flex';
      info.style.flexDirection = 'column';
      info.style.gap = '2px';
      info.style.fontWeight = 'normal';
      info.style.overflow = 'visible';

      const n1 = el('div', null, mask.name);
      n1.style.fontSize = '16.5px';
      n1.style.overflow = 'hidden';
      n1.style.textOverflow = 'ellipsis';
      n1.style.whiteSpace = 'nowrap';

      const n2 = el('div', null,
        (mask.side === 'right' ? '右侧' : '左侧') +
        (mask.id === state.currentMaskId ? ' · 当前身份' : ''));
      n2.style.fontSize = '12.5px';
      n2.style.color = 'var(--wx-text3)';

      info.appendChild(n1);
      info.appendChild(n2);

      c.appendChild(av);
      c.appendChild(info);

      if (mask.id === state.currentMaskId) {
        const check = el('span', null, '✓');
        check.style.color = 'var(--wx-green)';
        check.style.fontSize = '19px';
        check.style.fontWeight = '600';
        c.appendChild(check);
      }

      const edit = el('button', null, '编辑');
      edit.style.cssText = 'border:0;background:transparent;color:var(--wx-blue);font-size:14.5px;padding:4px 2px;margin-left:8px;cursor:pointer;';
      edit.addEventListener('click', e => {
        e.stopPropagation();
        push('maskEdit', { id: mask.id });
      });
      c.appendChild(edit);

      c.addEventListener('click', () => {
        state.currentMaskId = mask.id;
        save();
        renderMe();
        renderChatList();
        renderContacts();
        // 重新渲染当前页显示勾选
        renderSub();
        toast('已切换为「' + mask.name + '」');
      });

      g.appendChild(c);
    });

    scroll.appendChild(g);

    const g2 = el('div', 'group');
    const add = el('div', 'cell center');
    const at = el('span', 'cell-title', '＋ 新建面具');
    at.style.color = 'var(--wx-green)';
    add.appendChild(at);
    add.addEventListener('click', () => push('maskEdit', { id: null }));
    g2.appendChild(add);
    scroll.appendChild(g2);

    const hint = el('div', 'hint');
    hint.style.background = 'transparent';
    hint.textContent = '点面具即可切换当前身份；点「编辑」可以改名字、头像和左右位置。';
    scroll.appendChild(hint);
  });
}

/* ============ 面具编辑页 ============ */
function buildMaskEditPage(params) {
  const id = params.id;
  let editing = !!id;
  let mask;

  if (editing) {
    mask = state.masks.find(m => m.id === id);
    if (!mask) return null;
  } else {
    mask = { name: '', avatar: '🙂', side: state.masks.length ? 'left' : 'right' };
  }

  let side = mask.side;

  const page = subShell(editing ? '编辑面具' : '新建面具', null, scroll => {
    const g = el('div', 'group');

    const f1 = el('div', 'field');
    f1.appendChild(el('label', null, '名字'));
    const nameInput = el('input');
    nameInput.type = 'text';
    nameInput.value = mask.name;
    nameInput.placeholder = '给这个面具起个名字';
    f1.appendChild(nameInput);
    g.appendChild(f1);

    const f2 = el('div', 'field');
    f2.appendChild(el('label', null, '头像'));
    const avInput = el('input');
    avInput.type = 'text';
    avInput.value = mask.avatar;
    avInput.placeholder = 'emoji，或图片链接';
    f2.appendChild(avInput);
    g.appendChild(f2);

    const f3 = el('div', 'field');
    f3.appendChild(el('label', null, '位置'));
    const choice = el('div', 'side-choice');
    const bR = el('button', null, '右侧');
    const bL = el('button', null, '左侧');
    function refresh() {
      bR.classList.toggle('on', side === 'right');
      bL.classList.toggle('on', side === 'left');
    }
    bR.addEventListener('click', () => { side = 'right'; refresh(); });
    bL.addEventListener('click', () => { side = 'left';  refresh(); });
    refresh();
    choice.appendChild(bR);
    choice.appendChild(bL);
    f3.appendChild(choice);
    g.appendChild(f3);

    scroll.appendChild(g);

    const actions = el('div');
    actions.style.padding = '20px 16px';

    const saveBtn = el('button', null, '保存');
    saveBtn.style.cssText = 'width:100%;height:48px;border:0;border-radius:8px;background:var(--wx-green);color:#fff;font-size:16.5px;cursor:pointer;';
    saveBtn.addEventListener('click', () => {
      const nm = nameInput.value.trim() || '未命名';
      const av = avInput.value.trim() || '🙂';

      if (editing) {
        const m = state.masks.find(x => x.id === id);
        if (m) { m.name = nm; m.avatar = av; m.side = side; }
      } else {
        const m = { id: uid(), name: nm, avatar: av, side };
        state.masks.push(m);
        state.currentMaskId = m.id;
      }
      save();
      renderMe();
      renderChatList();
      renderContacts();
      toast('已保存');
      pop();
    });
    actions.appendChild(saveBtn);

    if (editing) {
      const delBtn = el('button', null, '删除这个面具');
      delBtn.style.cssText = 'width:100%;height:48px;border:1px solid #f0c0bf;border-radius:8px;background:#fff;color:var(--wx-red);font-size:16.5px;margin-top:10px;cursor:pointer;';
      delBtn.addEventListener('click', () => {
        if (state.masks.length <= 1) { toast('至少要保留一个面具'); return; }
        if (!confirm('删除面具「' + mask.name + '」？\n它发过的消息也会一起删除。')) return;
        state.masks = state.masks.filter(x => x.id !== id);
        state.messages = state.messages.filter(x => x.maskId !== id);
        state.moments = state.moments.filter(x => x.maskId !== id);
        if (state.currentMaskId === id) state.currentMaskId = state.masks[0].id;
        save();
        renderMe();
        renderChatList();
        renderContacts();
        toast('已删除');
        pop();
      });
      actions.appendChild(delBtn);
    }

    scroll.appendChild(actions);
  });

  return page;
}

/* ============ 朋友圈 ============ */
function buildMomentsPage() {
  const page = el('div', 'sub-page');

  const nav = el('header', 'nav');
  const back = el('button', 'nav-back', '‹');
  back.addEventListener('click', pop);
  nav.appendChild(back);
  nav.appendChild(el('div', 'nav-title', '朋友圈'));
  const right = el('div', 'nav-right');
  const addBtn = el('button', null, '＋');
  addBtn.addEventListener('click', openMomentSheet);
  right.appendChild(addBtn);
  nav.appendChild(right);
  page.appendChild(nav);

  const scroll = el('div', 'scroll');
  scroll.style.paddingBottom = '100px';

  const cover = el('div', 'moment-cover');
  const who = el('div', 'who');
  const m = currentMask();
  const av = el('div', 'avatar lg');
  setAvatar(av, m.avatar);
  const nm = el('b', null, m.name);
  who.appendChild(av);
  who.appendChild(nm);
  cover.appendChild(who);
  scroll.appendChild(cover);

  const list = el('div', 'moment-list');
  list.id = 'momentList';
  scroll.appendChild(list);

  page.appendChild(scroll);
  renderMoments(list);
  return page;
}

function renderMoments(list) {
  const box = list || $('#momentList');
  if (!box) return;
  box.innerHTML = '';

  if (!state.moments.length) {
    box.innerHTML = '<div class="empty">还没有动态<br>点右上角 ＋ 发一条</div>';
    return;
  }

  state.moments.slice().sort((a, b) => b.time - a.time).forEach(mo => {
    const mask = getMask(mo.maskId);
    const card = el('div', 'moment');

    const head = el('div', 'moment-head');
    const av = el('div', 'avatar');
    setAvatar(av, mask.avatar);

    const body = el('div', 'moment-body');
    body.appendChild(el('div', 'moment-name', mask.name));
    body.appendChild(el('div', 'moment-text', mo.text));

    if (mo.image) {
      const im = el('div', 'moment-img');
      const img = document.createElement('img');
      img.src = mo.image;
      img.onerror = () => { im.style.display = 'none'; };
      im.appendChild(img);
      body.appendChild(im);
    }

    const foot = el('div', 'moment-foot');

    const liked = (mo.likes || []).includes(state.currentMaskId);
    const likeBtn = el('button', 'moment-act' + (liked ? ' on' : ''),
      (liked ? '❤️ ' : '🤍 ') + ((mo.likes || []).length || ''));
    likeBtn.addEventListener('click', () => {
      mo.likes = mo.likes || [];
      const i = mo.likes.indexOf(state.currentMaskId);
      if (i >= 0) mo.likes.splice(i, 1); else mo.likes.push(state.currentMaskId);
      save();
      renderMoments(box);
    });

    const delBtn = el('button', 'moment-act', '🗑 删除');
    delBtn.addEventListener('click', () => {
      if (!confirm('删除这条动态？')) return;
      state.moments = state.moments.filter(x => x.id !== mo.id);
      save();
      renderMoments(box);
    });

    foot.appendChild(likeBtn);
    foot.appendChild(delBtn);
    foot.appendChild(el('span', 'moment-time', relTime(mo.time)));
    body.appendChild(foot);

    head.appendChild(av);
    head.appendChild(body);
    card.appendChild(head);
    box.appendChild(card);
  });
}

let momentMaskId = null;
function openMomentSheet() {
  momentMaskId = state.currentMaskId;
  openSheet('发表动态', build => {
    const f1 = el('div', 'field');
    f1.appendChild(el('label', null, '身份'));
    const choice = el('div', 'side-choice');
    choice.id = 'momentChoice';
    function renderChoice() {
      choice.innerHTML = '';
      state.masks.forEach(m => {
        const b = el('button', null, m.name);
        if (m.id === momentMaskId) b.classList.add('on');
        b.addEventListener('click', () => {
          momentMaskId = m.id;
          renderChoice();
        });
        choice.appendChild(b);
      });
    }
    renderChoice();
    f1.appendChild(choice);
    build.appendChild(f1);

    const f2 = el('div', 'field');
    f2.style.alignItems = 'flex-start';
    f2.appendChild(el('label', null, '内容'));
    const ta = el('textarea');
    ta.id = 'momentText';
    ta.placeholder = '这一刻的想法...';
    f2.appendChild(ta);
    build.appendChild(f2);

    const f3 = el('div', 'field');
    f3.appendChild(el('label', null, '图片'));
    const imgIn = el('input');
    imgIn.type = 'text';
    imgIn.id = 'momentImg';
    imgIn.placeholder = '图片链接（可留空）';
    f3.appendChild(imgIn);
    build.appendChild(f3);
  }, [{
    text: '发表',
    primary: true,
    onClick: () => {
      const text = $('#momentText').value.trim();
      const image = $('#momentImg').value.trim();
      if (!text && !image) { toast('写点什么吧'); return; }
      state.moments.push({
        id: uid(),
        maskId: momentMaskId,
        text,
        image,
        likes: [],
        time: Date.now()
      });
      save();
      closeSheet();
      renderMoments();
      toast('已发表');
    }
  }]);
}

function buildCssPage() {
  return subShell('自定义 CSS', {
    text: '保存',
    onClick: () => { toast('已保存'); pop(); }
  }, scroll => {
    const wrap = el('div');
    wrap.style.padding = '14px 16px';

    const ta = el('textarea');
    ta.id = 'cssEditor';
    ta.spellcheck = false;
    ta.value = state.css;
    ta.placeholder = ':root{ --wx-bubble-me: #ffd6e7; }';
    ta.addEventListener('input', () => {
      state.css = ta.value;
      applyCss(state.css);
      save();
    });
    wrap.appendChild(ta);

    const ps = el('div', 'presets');
    Object.keys(PRESETS).forEach(k => {
      const b = el('button', null, ({
        reset: '恢复默认', dark: '暗色', round: '大圆角',
        pink: '粉色气泡', serif: '衬线字体', wallpaper: '背景图'
      })[k]);
      b.addEventListener('click', () => {
        if (k === 'reset' && state.css && !confirm('恢复默认？')) return;
        ta.value = PRESETS[k];
        state.css = PRESETS[k];
        applyCss(state.css);
        save();
      });
      ps.appendChild(b);
    });

    scroll.appendChild(wrap);

    const hint = el('div', 'hint');
    hint.innerHTML =
      '可用变量：<br>' +

      '<code>--wx-bubble-other</code> 左侧气泡 · ' +
      '<code>--wx-text</code> 文字 · ' +
      '<code>--wx-font-size</code> 字号 · ' +
      '<code>--wx-radius</code> 圆角<br>' +
      '也可直接写选择器：<code>.bubble</code> <code>.cell</code> <code>.tabbar</code>';
    scroll.appendChild(hint);
  });
}

const userStyleEl = $('#userStyle');
function applyCss(css) {
  userStyleEl.textContent = css || '';
}

/* ============ 通用弹层 ============ */
const overlay = $('#overlay');
const sheetEl = $('#sheet');
let sheetOpen = false;

function openSheet(title, buildBody, actions) {
  sheetEl.innerHTML = '';

  const head = el('div', 'sheet-head');
  head.appendChild(el('span', null, title));
  const closeB = el('button', null, '取消');
  closeB.addEventListener('click', closeSheet);
  head.appendChild(closeB);
  sheetEl.appendChild(head);

  const body = el('div', 'sheet-body');
  buildBody(body);
  sheetEl.appendChild(body);

  if (actions && actions.length) {
    const acts = el('div', 'sheet-actions');
    actions.forEach(a => {
      const b = el('button', a.primary ? 'btn-primary' : (a.danger ? 'btn-danger' : 'btn-plain'), a.text);
      b.addEventListener('click', a.onClick);
      acts.appendChild(b);
    });
    sheetEl.appendChild(acts);
  }

  overlay.classList.add('show');
  sheetEl.classList.add('show');
  sheetOpen = true;
}
function closeSheet() {
  overlay.classList.remove('show');
  sheetEl.classList.remove('show');
  sheetOpen = false;
  setTimeout(() => { if (!sheetOpen) sheetEl.innerHTML = ''; }, 300);
}
overlay.addEventListener('click', closeSheet);

/* ============ 数据导入导出 ============ */
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wechat-mask-backup-' + Date.now() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || !Array.isArray(obj.masks)) throw 0;
        Object.assign(state, obj);
        if (!state.masks.some(m => m.id === state.currentMaskId)) {
          state.currentMaskId = state.masks[0].id;
        }
        save();
        applyCss(state.css || '');
        renderMe();
        renderChatList();
        renderContacts();
        toast('导入成功');
      } catch (e) {
        toast('文件格式不对');
      }
    };
    reader.readAsText(f);
  });
  inp.click();
}

/* ============ PWA ============ */
function makeIcon(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#16d16d');
  g.addColorStop(1, '#07c160');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  rr(size * .16, size * .22, size * .52, size * .36, size * .10);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  rr(size * .36, size * .46, size * .48, size * .30, size * .09);
  ctx.fill();
  return c.toDataURL('image/png');
}
